<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>AF Copilot — Acesso</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #082e56, #14538f); color: #263238; }
    .card { width: 380px; background: white; border-radius: 14px; padding: 32px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35); }
    .logo-img { display: block; width: 76px; height: auto; margin: 0 auto 6px; }
    .logo { text-align: center; color: #0b3d70; font-size: 26px; font-weight: 300;
      letter-spacing: 4px; margin-bottom: 4px; }
    .sub { text-align: center; font-size: 11px; color: #78909c; margin-bottom: 26px; }
    label { display: block; font-size: 12px; color: #546e7a; margin: 14px 0 6px; }
    input { width: 100%; padding: 11px 12px; border: 1px solid #cfd8dc; border-radius: 7px;
      font-size: 14px; outline: none; }
    input:focus { border-color: #14538f; box-shadow: 0 0 0 3px rgba(20,83,143,.12); }
    button { width: 100%; margin-top: 22px; padding: 12px; border: none; border-radius: 7px;
      background: #0b3d70; color: white; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #14538f; }
    button:disabled { opacity: .6; cursor: wait; }
    .error { color: #c62828; font-size: 12px; margin-top: 12px; min-height: 16px; }
    .foot { text-align: center; font-size: 10px; color: #90a4ae; margin-top: 20px; }
  </style>
</head>
<body>
  <form class="card" id="form">
    <img class="logo-img" src="brasao.png" alt="Brasão do Estado da Bahia" />
    <div class="logo">AFSESAB</div>
    <div class="sub">AF COPILOT · ACESSO INSTITUCIONAL</div>

    <label for="user">Usuário</label>
    <input id="user" autocomplete="username" required autofocus />

    <label for="pass">Senha</label>
    <input id="pass" type="password" autocomplete="current-password" required />

    <div class="error" id="error"></div>
    <button type="button" id="btn">Entrar</button>

    <div class="foot">Acesso restrito · SESAB</div>
  </form>
  <script src="login.js"></script>
</body>
</html>
