name: AF Copilot CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  security-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4 pydantic==2.9.2 pydantic-settings==2.7.1 sqlalchemy==2.1.8
      - name: Rodar testes de segurança
        run: python -m pytest tests -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar e compilar
        run: |
          npm install
          npm run build
